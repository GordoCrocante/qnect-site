<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qnect Rewind · Te retamos</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#2B2A35;--y:#EDE57A;--m:#74E6CC;--mute:#5E5C6B}
body{margin:0;min-height:100vh;font-family:"Red Hat Display",system-ui,sans-serif;color:var(--ink);background:radial-gradient(55% 40% at 5% 0,rgba(116,230,204,.45),transparent 70%),radial-gradient(45% 35% at 100% 5%,rgba(237,229,122,.5),transparent 70%),#fff;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-weight:900;font-size:19px}
.lang button{border:0;background:none;font:700 14px inherit;font-family:inherit;color:var(--mute);cursor:pointer;padding:4px 6px}.lang button.on{color:var(--ink);border-bottom:2px solid var(--ink)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 22px 40px}
.scr{display:none;max-width:760px;width:100%;text-align:center;animation:in .5s ease}.scr.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-weight:900;letter-spacing:-.045em;line-height:.95;font-size:clamp(54px,12vw,120px);margin:0 0 18px}
h2{font-weight:900;letter-spacing:-.04em;line-height:1;font-size:clamp(34px,7vw,64px);margin:0 0 12px}
p{font-size:clamp(17px,2.4vw,22px);color:var(--mute);margin:0 0 22px;line-height:1.35}
.btn{font:800 20px "Red Hat Display",sans-serif;color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:15px 34px;background:linear-gradient(100deg,var(--y),var(--m));box-shadow:5px 5px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:none}
.lv{display:flex;gap:14px;justify-content:center;align-items:stretch;margin:26px 0;flex-wrap:wrap}
.card{width:190px;min-height:230px;perspective:800px;cursor:pointer;border:0;background:none;padding:0;font-family:inherit}
.in{position:relative;width:100%;height:230px;transition:transform .6s;transform-style:preserve-3d}.card.f .in{transform:rotateY(180deg)}
.fc,.bk{position:absolute;inset:0;border-radius:26px;border:2px solid var(--ink);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-shadow:5px 5px 0 var(--ink)}
.fc{background:linear-gradient(135deg,var(--y),var(--m))}.fc b{font-size:60px;font-weight:900}.fc span{font-weight:800;font-size:17px}
.bk{background:#fff;transform:rotateY(180deg)}.bk b{font-size:22px;font-weight:900;letter-spacing:-.02em;margin-bottom:8px}.bk span{font-size:16px;color:var(--mute);line-height:1.3}
.lock{background:#eef0f4;color:#9a9aa8;border-style:dashed;box-shadow:none}
.dots{position:relative;height:200px;margin:10px auto 24px;max-width:520px}
.dots svg{width:100%;height:100%}
.win{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:22px 0 28px;text-align:left}
.win div{border-radius:24px;padding:20px 22px;font-size:18px;color:var(--mute)}.win b{display:block;color:var(--ink);font-size:21px;margin-bottom:4px}
.win div:nth-child(1){background:#FBF8D0}.win div:nth-child(2){background:#DAF4EC}.win div:nth-child(3){background:#EEF0F6}
.prog{display:flex;gap:6px;justify-content:center;margin-bottom:22px}.prog i{width:34px;height:6px;border-radius:9px;background:#d8dae2}.prog i.on{background:var(--ink)}
.small{font-size:15px;color:var(--mute);margin-top:18px}
</style></head><body>
<div class="top"><span>Qnect Rewind</span><span class="lang"><button id="bes" class="on">ES</button><button id="ben">EN</button></span></div>
<div class="stage">
<section class="scr on" id="s0"><h1 data-t="h"></h1><p data-t="sub"></p><button class="btn" id="go" data-t="play"></button><div class="small" data-t="free"></div></section>
<section class="scr" id="s1"><div class="prog"><i class="on"></i><i></i><i></i></div><h2 data-t="l1"></h2><p data-t="l1p"></p>
<div class="lv" id="cards"></div><div id="n1" style="display:none"><button class="btn" id="to2" data-t="next"></button></div></section>
<section class="scr" id="s2"><div class="prog"><i class="on"></i><i class="on"></i><i></i></div><h2 data-t="compete"></h2><p data-t="connect"></p>
<div class="dots"><svg viewBox="0 0 520 200" id="svg"></svg></div><button class="btn" id="to3" data-t="next"></button></section>
<section class="scr" id="s3"><div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i></div><h2 data-t="wins"></h2>
<div class="win"><div><b data-t="w1"></b><span data-t="w1p"></span></div><div><b data-t="w2"></b><span data-t="w2p"></span></div><div><b data-t="w3"></b><span data-t="w3p"></span></div></div>
<div class="lv"><div class="card"><div class="fc lock" style="position:relative;height:150px;box-shadow:none"><b style="font-size:34px">🔒</b><span data-t="lv2"></span></div></div></div>
<p data-t="teaser"></p><a class="btn" id="cta" href="mailto:collab@qnectrewind.com?subject=Acepto%20el%20reto" data-t="cta"></a><div class="small">collab@qnectrewind.com</div></section>
</div>
<script>
var T={es:{h:"Te retamos.",sub:"Nivel 1 de una escalada: aprender idiomas. 30 segundos para ver cómo es.",play:"Jugar",free:"Primera ronda gratis",l1:"Nivel 1: Idiomas",l1p:"Toca las 3 cartas.",next:"Siguiente",
c:[["Equipo","6 personas, una capitana."],["Reto","Un tráiler en español en 7 días."],["Estreno","Una azotea en Barcelona. La sala vota."]],cn:["Equipo","Reto","Estreno"],
compete:"Compiten.",connect:"Acaban siendo un equipo.",wins:"Lo que gana tu academia",w1:"Más motivación",w1p:"Nadie quiere fallar a su equipo.",w2:"Más alumnos",w2p:"Traen a sus amigos.",w3:"Contenido",w3p:"Tráileres que tu escuela puede compartir.",

var L=(navigator.language||"es").slice(0,2)=="es"?"es":"en";if(location.hash=="#en")L="en";if(location.hash=="#es")L="es";
var flipped=0;function $(i){return document.getElementById(i)}

$("bes").className=L=="es"?"on":"";$("ben").className=L=="en"?"on":"";
var c=$("cards");c.innerHTML="";t.c.forEach(function(x,i){var b=document.createElement("button");b.className="card"+(i<flipped?" f":"");b.dataset.i=i;

b.onclick=function(){if(!b.classList.contains("f")){b.classList.add("f");flipped++;if(document.querySelectorAll(".card.f").length==3)$("n1").style.display="block"}};c.appendChild(b)});
flipped=0;$("n1").style.display="none"}

</script></body></html>
